[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basis-stack"
version = "0.1.0"
description = "The Basis Nexus stack: SNP contract, Basis Brain, Basis TRACE."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "mne>=1.6"]

[project.optional-dependencies]
dev = ["pytest>=7"]
viz = ["matplotlib>=3.7", "pillow>=9", "imageio-ffmpeg>=0.4"]

[tool.setuptools]
packages = ["snp", "brain", "trace", "locus", "fabric", "nexus", "core", "service"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
pythonpath = [".", "tests", "evals"]
python_files = ["test_*.py", "eval_*.py"]
