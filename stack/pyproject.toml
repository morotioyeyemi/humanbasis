[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basis-snp"
version = "0.1.0"
description = "SNP (Signal Normalization Protocol): the canonical message contract for the Basis stack."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["snp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
